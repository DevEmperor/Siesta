name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    name: End-to-end test in Firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - run: npm run test:e2e
